<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Python for Animes — Complete Course (Basics → Advanced)</title>
<style>
  :root{
    --bg:#0b0c10; --card:#111318; --card2:#0f1118; --muted:#9aa2ad; --ink:#e8eef7;
    --brand:#7c5cff; --brand2:#ff5cad; --accent:#ffd166; --border:#232630;
    --ok:#57cc99; --warn:#ff9f1c; --info:#5cc8ff;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; font:14px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, Arial;
    background:
      radial-gradient(900px 500px at 100% 0%, rgba(255,92,173,.10), transparent 60%),
      radial-gradient(1200px 600px at 0% 0%, #141723, #0b0c10 60%);
    color:var(--ink);
  }
  ::-webkit-scrollbar{width:10px; height:10px}
  ::-webkit-scrollbar-thumb{background:#252a3a; border-radius:8px}
  ::-webkit-scrollbar-track{background:transparent}

  a{color:#8ab4ff}

  /* ===== Top bar ===== */
  .topbar{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; gap:14px;
    padding:12px 18px; border-bottom:1px solid var(--border);
    background:rgba(11,12,16,.85); backdrop-filter:blur(10px);
  }
  .brand{display:flex; align-items:center; gap:10px; font-weight:800; letter-spacing:.2px}
  .brand .dot{width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand2)); box-shadow:0 0 14px rgba(124,92,255,.9)}
  .brand small{color:var(--muted); font-weight:600; margin-left:4px}
  .topbar .spacer{flex:1}
  .search{
    display:flex; align-items:center; gap:8px;
    background:#0f1118; border:1px solid var(--border); border-radius:999px;
    padding:8px 14px; min-width:220px;
  }
  .search input{background:transparent;border:0;outline:0;color:var(--ink);width:100%;font-size:13px}
  .search svg{opacity:.6; flex:none}

  .xp{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted)}
  .xp .bar{width:120px; height:8px; border-radius:999px; background:#1a1d29; overflow:hidden; border:1px solid var(--border)}
  .xp .fill{height:100%; background:linear-gradient(90deg,var(--brand),var(--brand2)); transition:width .4s ease}

  /* ===== Layout ===== */
  .shell{display:grid; grid-template-columns:280px 1fr; min-height:calc(100% - 58px)}
  @media (max-width:900px){ .shell{grid-template-columns:1fr} .sidebar{display:none} .sidebar.open{display:block} }

  /* ===== Sidebar ===== */
  .sidebar{
    border-right:1px solid var(--border); padding:16px 10px 40px; overflow-y:auto;
    height:calc(100vh - 58px); position:sticky; top:58px;
  }
  .mascot{
    display:flex; gap:10px; align-items:center; padding:10px 10px 14px; margin-bottom:6px;
    border-bottom:1px dashed var(--border);
  }
  .mascot .msg{font-size:12px; color:var(--muted)}
  .mascot .msg b{color:var(--accent)}
  .cat{margin:14px 6px 6px; font-size:11px; text-transform:uppercase; letter-spacing:.12em; color:#7b8696; font-weight:800}
  .topic-btn{
    width:100%; text-align:left; display:flex; align-items:center; gap:8px;
    padding:9px 10px; border-radius:10px; border:1px solid transparent; background:transparent;
    color:#cbd3e0; cursor:pointer; font-size:13px; margin:2px 0;
  }
  .topic-btn:hover{background:#151824}
  .topic-btn.active{background:#1a1030; border-color:#3a2a66; color:#fff}
  .topic-btn .lvl{
    width:7px; height:7px; border-radius:50%; flex:none;
  }
  .lvl.b{background:var(--ok)} .lvl.i{background:var(--info)} .lvl.a{background:var(--brand2)}
  .topic-btn .done{margin-left:auto; font-size:11px; color:var(--ok); opacity:0}
  .topic-btn.completed .done{opacity:1}

  /* ===== Main ===== */
  main{padding:26px 30px 80px; max-width:980px}
  .crumbs{color:var(--muted); font-size:12px; margin-bottom:10px}
  .crumbs b{color:#cbd3e0}

  .head{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:6px; flex-wrap:wrap}
  h1{margin:0 0 6px; font-size:26px; letter-spacing:.2px}
  .chip{
    display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px;
    font-size:11px; font-weight:800; letter-spacing:.02em; border:1px solid var(--border);
  }
  .chip.beginner{color:#9ae6b4; background:#0e1c14; border-color:#1c2b22}
  .chip.intermediate{color:#a9def9; background:#0e1a22; border-color:#1c3040}
  .chip.advanced{color:#ffb3d9; background:#22101a; border-color:#3a1c2e}

  .tags{display:flex; gap:6px; flex-wrap:wrap; margin:10px 0 18px}
  .tag{font-size:11px; padding:3px 9px; border-radius:999px; background:#151824; color:var(--muted); border:1px solid var(--border)}

  .lead{font-size:15px; color:#d7dde7; margin:0 0 18px}

  .card{
    background:linear-gradient(180deg, var(--card), var(--card2));
    border:1px solid var(--border); border-radius:16px; padding:18px;
    margin-bottom:18px; box-shadow:0 20px 40px rgba(0,0,0,.25);
  }
  .card h3{margin:0 0 10px; font-size:14px; letter-spacing:.02em; color:#cbd3e0; display:flex; align-items:center; gap:8px}
  .card h3 .ico{font-size:16px}

  .scenario{
    border-left:3px solid var(--brand2); background:rgba(255,92,173,.06);
    padding:10px 14px; border-radius:8px; font-size:13.5px; color:#eadff0; margin-bottom:4px;
  }

  .keypoints{margin:0; padding-left:18px; color:#cfd7e6; font-size:13.5px}
  .keypoints li{margin:4px 0}

  pre.code{
    margin:0; background:#0a0b10; border:1px solid var(--border); border-radius:12px;
    padding:14px 16px; overflow-x:auto; font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    font-size:12.8px; line-height:1.65;
  }
  .kw{color:#c792ea} .fn{color:#82aaff} .str{color:#c3e88d} .com{color:#5c6472; font-style:italic}
  .num{color:#f78c6c} .cls{color:#ffcb6b}

  .out{
    background:#06110c; border:1px solid #163326; border-radius:12px; padding:12px 14px;
    font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:12.8px;
    color:#9ae6b4; white-space:pre-wrap;
  }
  .out::before{content:"▶ Output"; display:block; color:#57cc99; font-weight:800; font-size:11px; margin-bottom:6px; letter-spacing:.05em}

  .grid2{display:grid; grid-template-columns:1fr; gap:14px}
  @media (min-width:760px){ .grid2{grid-template-columns:1.15fr .85fr} }

  .footer-nav{display:flex; justify-content:space-between; gap:10px; margin-top:22px}
  .navbtn{
    display:flex; align-items:center; gap:8px; padding:10px 16px; border-radius:12px;
    border:1px solid var(--border); background:#151824; color:var(--ink); cursor:pointer; font-size:13px;
  }
  .navbtn:hover{filter:brightness(1.1)}
  .navbtn.primary{background:linear-gradient(135deg,var(--brand),var(--brand2)); border:none; font-weight:700}
  .navbtn:disabled{opacity:.35; cursor:not-allowed}

  .mark{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--muted); cursor:pointer; user-select:none}
  .mark input{accent-color:var(--brand)}

  .author-strip{display:flex; align-items:center; gap:12px; margin:0 0 18px; padding-bottom:14px; border-bottom:1px dashed var(--border)}
  .avatar-svg{width:52px;height:52px; border-radius:50%; background:#151824; border:2px solid #3a2a66; display:flex; align-items:center; justify-content:center}
  .author-strip .meta{font-size:12.5px; color:#aab3c0}
  .author-strip .meta b{color:#e8eef7}

  .empty-hint{color:var(--muted); font-size:13px}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><span class="dot"></span> Python for Animes <small>· Complete Course</small></div>
  <div class="spacer"></div>
  <div class="search">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="#9aa2ad" stroke-width="2"/><path d="M21 21l-4.3-4.3" stroke="#9aa2ad" stroke-width="2" stroke-linecap="round"/></svg>
    <input id="searchBox" placeholder="Search topics… e.g. decorators" />

    <span id="xpLabel">0 / 0 completed</span>
    <div class="bar"><div class="fill" id="xpFill" style="width:0%"></div></div>
  </div>
</div>

<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="mascot">
      <div class="avatar-svg">
        <svg width="30" height="30" viewBox="0 0 64 64">
          <circle cx="32" cy="32" r="30" fill="#1a1030" stroke="#7c5cff" stroke-width="2"/>
          <circle cx="22" cy="30" r="4" fill="#ffd166"/>
          <circle cx="42" cy="30" r="4" fill="#ffd166"/>
          <path d="M20 42 Q32 50 44 42" stroke="#ff5cad" stroke-width="3" fill="none" stroke-linecap="round"/>
          <path d="M10 20 L20 26 M54 20 L44 26" stroke="#7c5cff" stroke-width="3" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="msg">Hey senpai! I'm <b>Py-chan</b> 🐍<br/>Pick a topic and let's level up.</div>
    </div>
    <div id="navList"></div>
  </aside>

  <main>
    <div class="author-strip">
      <div class="avatar-svg">
        <svg width="30" height="30" viewBox="0 0 64 64">
          <circle cx="32" cy="32" r="30" fill="#1a1030" stroke="#ff5cad" stroke-width="2"/>
          <circle cx="24" cy="28" r="3.5" fill="#5cc8ff"/>
          <circle cx="40" cy="28" r="3.5" fill="#5cc8ff"/>
          <path d="M22 40 Q32 46 42 40" stroke="#ffd166" stroke-width="3" fill="none" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="meta"><b>Course:</b> Python — Zero to Advanced &nbsp;|&nbsp; Real-world examples in every lesson &nbsp;|&nbsp; Built for Simatrix Academy learners</div>
    </div>

    <div class="crumbs" id="crumbs"></div>
    <div id="content"></div>
  </main>
</div>

<script>
/* ============================ COURSE DATA ============================ */
const CATS = ["Fundamentals","Control Flow","Data Structures","Functions","Object-Oriented Programming","Files & Data","Exception Handling","Advanced Python"];

const T = (s)=>s; // no-op tag helper for readability

const TOPICS = [
/* ---------------- FUNDAMENTALS ---------------- */
{
  id:"variables", cat:"Fundamentals", title:"Variables & Data Types", level:"beginner",
  tags:["int","float","str","bool","type()"],
  lead:"Variables are labelled boxes that hold data. Python figures out the type automatically — this is called dynamic typing.",
  scenario:"Guild Registration Desk — every adventurer who joins the Hero Guild gets their basic profile stored: name, level, HP, and guild membership status.",
  key:[
    "Python has no separate 'declare' step — assignment creates the variable.",
    "Core built-in types: int, float, str, bool, complex, NoneType.",
    "Use type(x) to inspect a variable's type at runtime."
  ],
  code:`hero_name = "Aria Flameheart"      <span class="com"># str</span>
hero_level = 12                     <span class="com"># int</span>
hp_percent = 87.5                   <span class="com"># float</span>
is_guild_member = True              <span class="com"># bool</span>
pet_dragon = None                   <span class="com"># NoneType</span>

<span class="kw">print</span>(<span class="fn">type</span>(hero_name), <span class="fn">type</span>(hero_level), <span class="fn">type</span>(hp_percent))
<span class="kw">print</span>(<span class="str">f"{hero_name} | Lv.{hero_level} | HP {hp_percent}% | Guild: {is_guild_member}"</span>)`,
  out:`<class 'str'> <class 'int'> <class 'float'>
Aria Flameheart | Lv.12 | HP 87.5% | Guild: True`
},
{
  id:"typecast", cat:"Fundamentals", title:"Type Casting", level:"beginner",
  tags:["int()","float()","str()","conversion"],
  lead:"Type casting converts a value from one type to another, e.g. turning user text input into a number you can do math with.",
  scenario:"Tournament Sign-up Form — players type their age and entry fee as text; the system must convert them to numbers before validating eligibility.",
  key:[
    "input() always returns a string, even for numbers.",
    "int('12') → 12, float('3.5') → 3.5, str(42) → '42'.",
    "Casting an invalid string (e.g. int('abc')) raises a ValueError."
  ],
  code:`age_input = <span class="str">"17"</span>          <span class="com"># came from a form field, so it's text</span>
fee_input = <span class="str">"49.99"</span>

age = <span class="fn">int</span>(age_input)
entry_fee = <span class="fn">float</span>(fee_input)

<span class="kw">if</span> age >= 16:
    <span class="kw">print</span>(<span class="str">f"Eligible! Pay \${entry_fee:.2f} to enter the Tournament of Blades."</span>)
<span class="kw">else</span>:
    <span class="kw">print</span>(<span class="str">"Too young for this arc — try the Junior League."</span>)`,
  out:`Eligible! Pay $49.99 to enter the Tournament of Blades.`
},
{
  id:"operators", cat:"Fundamentals", title:"Operators", level:"beginner",
  tags:["arithmetic","comparison","logical"],
  lead:"Operators combine values: arithmetic (+ - * / // % **), comparison (== != > <), and logical (and or not).",
  scenario:"Battle Damage Calculator — combine attack power, defense, and a critical-hit chance to decide how much HP an enemy loses.",
  key:[
    "// is floor (integer) division, % is remainder (modulo).",
    "** is exponent: 2 ** 10 == 1024.",
    "Comparison chaining works: 0 < score <= 100."
  ],
  code:`attack = 85
defense = 30
is_critical = <span class="kw">True</span>

base_damage = attack - defense
final_damage = base_damage * 2 <span class="kw">if</span> is_critical <span class="kw">else</span> base_damage

<span class="kw">print</span>(<span class="str">"Base damage:"</span>, base_damage)
<span class="kw">print</span>(<span class="str">"Critical hit?"</span>, is_critical)
<span class="kw">print</span>(<span class="str">"Final damage dealt:"</span>, final_damage)
<span class="kw">print</span>(<span class="str">"Enemy defeated?"</span>, final_damage >= 100)`,
  out:`Base damage: 55
Critical hit? True
Final damage dealt: 110
Enemy defeated? True`
},
{
  id:"strings", cat:"Fundamentals", title:"Strings & String Methods", level:"beginner",
  tags:["slicing",".upper()",".split()","f-strings"],
  lead:"Strings are immutable sequences of characters. Python gives you dozens of built-in methods to search, transform, and format them.",
  scenario:"Character Name Generator — clean up and format a messy user-submitted character name for the game database.",
  key:[
    "Strings support slicing: name[0:3], name[-1], name[::-1] (reverse).",
    "Common methods: .strip(), .lower(), .upper(), .replace(), .split(), .join().",
    "f-strings (f'...{expr}...') are the modern way to format text."
  ],
  code:`raw = <span class="str">"   naruTO uzuMAKI  "</span>

clean = raw.strip().title()
first, last = clean.split()
initials = <span class="str">f"{first[0]}.{last[0]}."</span>

<span class="kw">print</span>(<span class="fn">repr</span>(clean))
<span class="kw">print</span>(<span class="str">f"Callsign: {initials} | Reversed: {clean[::-1]}"</span>)
<span class="kw">print</span>(<span class="str">"-"</span>.join([first, last]).lower())`,
  out:`'Naruto Uzumaki'
Callsign: N.U. | Reversed: ikamuzU otoraN
naruto-uzumaki`
},
{
  id:"fstrings", cat:"Fundamentals", title:"Input, Output & Formatting", level:"beginner",
  tags:["print()","input()","f-string spec"],
  lead:"print() sends text to the console; input() pauses and reads what the user types. Format specifiers control decimals, padding, and alignment.",
  scenario:"Guild Stat Sheet — display a character's stats neatly aligned in a table-like console readout.",
  key:[
    "print(a, b, sep=', ', end='\\n') controls separators and line endings.",
    "f'{value:.2f}' rounds to 2 decimals; f'{value:>10}' right-aligns in 10 chars.",
    "input() always returns str — cast it if you need a number."
  ],
  code:`stats = {<span class="str">"STR"</span>: 78, <span class="str">"AGI"</span>: 92, <span class="str">"MAG"</span>: 65.333}

<span class="kw">for</span> stat, value <span class="kw">in</span> stats.items():
    <span class="kw">print</span>(<span class="str">f"{stat:<5}: {value:>8.2f}"</span>)

<span class="kw">print</span>(<span class="str">"HP"</span>, <span class="str">"MP"</span>, <span class="str">"SP"</span>, sep=<span class="str">" | "</span>)`,
  out:`STR  :    78.00
AGI  :    92.00
MAG  :    65.33
HP | MP | SP`
},

/* ---------------- CONTROL FLOW ---------------- */
{
  id:"ifelse", cat:"Control Flow", title:"if / elif / else", level:"beginner",
  tags:["conditions","branching"],
  lead:"Conditional statements let your program make decisions and run different code paths depending on data.",
  scenario:"Rank Promotion System — a ninja's rank is decided automatically based on their mission points.",
  key:[
    "Python uses indentation (not braces) to define code blocks.",
    "elif chains let you check multiple conditions in order.",
    "Any non-zero/non-empty value is 'truthy'."
  ],
  code:`mission_points = 340

<span class="kw">if</span> mission_points >= 500:
    rank = <span class="str">"S-Rank"</span>
<span class="kw">elif</span> mission_points >= 300:
    rank = <span class="str">"A-Rank"</span>
<span class="kw">elif</span> mission_points >= 100:
    rank = <span class="str">"B-Rank"</span>
<span class="kw">else</span>:
    rank = <span class="str">"Genin"</span>

<span class="kw">print</span>(<span class="str">f"Mission points: {mission_points} → Promoted to {rank}"</span>)`,
  out:`Mission points: 340 → Promoted to A-Rank`
},
{
  id:"forloop", cat:"Control Flow", title:"for Loops", level:"beginner",
  tags:["range()","enumerate()","iteration"],
  lead:"for loops iterate over any sequence — lists, strings, ranges, dictionaries — running a block once per item.",
  scenario:"Squad Roll Call — announce every member of a ninja squad with their position number.",
  key:[
    "range(n) generates 0..n-1; range(a,b,step) is flexible.",
    "enumerate(seq) gives you (index, item) pairs.",
    "You can loop directly over lists, strings, dict.items(), etc."
  ],
  code:`squad = [<span class="str">"Kai"</span>, <span class="str">"Mira"</span>, <span class="str">"Sora"</span>, <span class="str">"Ren"</span>]

<span class="kw">for</span> index, member <span class="kw">in</span> <span class="fn">enumerate</span>(squad, start=1):
    <span class="kw">print</span>(<span class="str">f"Squad member #{index}: {member}"</span>)

total_power = <span class="fn">sum</span>(<span class="fn">len</span>(name) * 10 <span class="kw">for</span> name <span class="kw">in</span> squad)
<span class="kw">print</span>(<span class="str">f"Combined chakra estimate: {total_power}"</span>)`,
  out:`Squad member #1: Kai
Squad member #2: Mira
Squad member #3: Sora
Squad member #4: Ren
Combined chakra estimate: 150`
},
{
  id:"whileloop", cat:"Control Flow", title:"while Loops", level:"beginner",
  tags:["condition loops","game loop"],
  lead:"while loops repeat as long as a condition stays true — perfect for anything that continues until a goal or failure state is reached.",
  scenario:"Boss Battle Simulator — attack a boss repeatedly until its HP drops to zero.",
  key:[
    "Always make sure the loop condition can eventually become False.",
    "while True: with an internal break is a common 'run forever until event' pattern.",
    "Great for game loops, retry logic, and polling."
  ],
  code:`boss_hp = 100
turn = 0

<span class="kw">while</span> boss_hp > 0:
    turn += 1
    damage = 18 <span class="kw">if</span> turn % 3 != 0 <span class="kw">else</span> 40  <span class="com"># special move every 3rd turn</span>
    boss_hp -= damage
    <span class="kw">print</span>(<span class="str">f"Turn {turn}: dealt {damage} dmg → Boss HP: {max(boss_hp, 0)}"</span>)

<span class="kw">print</span>(<span class="str">f"Boss defeated in {turn} turns!"</span>)`,
  out:`Turn 1: dealt 18 dmg → Boss HP: 82
Turn 2: dealt 18 dmg → Boss HP: 64
Turn 3: dealt 40 dmg → Boss HP: 24
Turn 4: dealt 18 dmg → Boss HP: 6
Turn 5: dealt 18 dmg → Boss HP: 0
Boss defeated in 5 turns!`
},
{
  id:"breakcontinue", cat:"Control Flow", title:"break, continue & pass", level:"beginner",
  tags:["loop control"],
  lead:"break exits a loop early, continue skips to the next iteration, and pass is a no-op placeholder.",
  scenario:"Inventory Scanner — stop scanning once a legendary item is found, but skip (ignore) any cursed items along the way.",
  key:[
    "break stops the loop immediately.",
    "continue jumps back to the loop's condition/next item.",
    "pass is used when Python needs a statement but you have nothing to do yet (e.g. stub functions)."
  ],
  code:`inventory = [<span class="str">"potion"</span>, <span class="str">"cursed ring"</span>, <span class="str">"iron sword"</span>, <span class="str">"legendary bow"</span>, <span class="str">"gold coin"</span>]

<span class="kw">for</span> item <span class="kw">in</span> inventory:
    <span class="kw">if</span> item == <span class="str">"cursed ring"</span>:
        <span class="kw">continue</span>   <span class="com"># skip cursed items entirely</span>
    <span class="kw">if</span> item == <span class="str">"legendary bow"</span>:
        <span class="kw">print</span>(<span class="str">f"Found it! {item.title()}"</span>)
        <span class="kw">break</span>      <span class="com"># stop scanning, we got what we needed</span>
    <span class="kw">print</span>(<span class="str">f"Scanned: {item}"</span>)`,
  out:`Scanned: potion
Scanned: iron sword
Found it! Legendary Bow`
},

/* ---------------- DATA STRUCTURES ---------------- */
{
  id:"list", cat:"Data Structures", title:"Lists", level:"beginner",
  tags:["mutable","ordered","[]"],
  lead:"Lists are ordered, mutable collections — the go-to structure for anything you need to grow, shrink, sort, or reorder.",
  scenario:"Party Inventory — an adventuring party's shared item bag that changes constantly during a dungeon crawl.",
  key:[
    "Lists keep insertion order and allow duplicates.",
    "Common ops: .append(), .remove(), .sort(), .pop(), slicing.",
    "Lists are mutable — modifying one variable can affect others pointing to the same list."
  ],
  code:`bag = [<span class="str">"health potion"</span>, <span class="str">"rope"</span>, <span class="str">"torch"</span>]

bag.append(<span class="str">"mana crystal"</span>)
bag.insert(0, <span class="str">"map"</span>)
bag.remove(<span class="str">"torch"</span>)

<span class="kw">print</span>(<span class="str">"Bag:"</span>, bag)
<span class="kw">print</span>(<span class="str">"Items carried:"</span>, <span class="fn">len</span>(bag))
<span class="kw">print</span>(<span class="str">"Sorted:"</span>, <span class="fn">sorted</span>(bag))`,
  out:`Bag: ['map', 'health potion', 'rope', 'mana crystal']
Items carried: 4
Sorted: ['health potion', 'map', 'mana crystal', 'rope']`
},
{
  id:"tuple", cat:"Data Structures", title:"Tuples", level:"beginner",

{
  id:"recursion", cat:"Functions", title:"Recursion", level:"intermediate",
  tags:["base case","call stack"],
  lead:"A recursive function calls itself to break a big problem into smaller identical sub-problems, until a base case stops it.",
  scenario:"Skill Tree Unlock Cost — the total mana cost to unlock a skill depends on the cost of unlocking its prerequisite skill first.",
  key:[
    "Every recursive function needs a base case or it recurses forever.",
    "Each call adds a frame to the call stack — deep recursion can hit Python's recursion limit.",
    "Recursion often mirrors tree/graph-shaped problems very naturally."
  ],
  code:`<span class="kw">def</span> <span class="fn">unlock_cost</span>(tier):
    <span class="str">"""Tier 1 costs 10 mana; each tier costs its own cost + previous tier's cost."""</span>
    <span class="kw">if</span> tier == 1:
        <span class="kw">return</span> 10   <span class="com"># base case</span>
    <span class="kw">return</span> tier * 10 + <span class="fn">unlock_cost</span>(tier - 1)

<span class="kw">for</span> t <span class="kw">in</span> <span class="fn">range</span>(1, 5):
    <span class="kw">print</span>(<span class="str">f"Total mana to unlock tier {t}: {unlock_cost(t)}"</span>)`,
  out:`Total mana to unlock tier 1: 10
Total mana to unlock tier 2: 30
Total mana to unlock tier 3: 60
Total mana to unlock tier 4: 100`
},

{

{
  id:"encapsulation", cat:"Object-Oriented Programming", title:"Encapsulation", level:"intermediate",
  tags:["private attrs","@property"],
  lead:"Encapsulation hides internal state behind controlled access — using a leading underscore convention and @property for validation.",
  scenario:"Bank-style Mana Vault — a character's mana shouldn't be set to a negative or impossible value from outside the class.",
  key:[
    "_name (single underscore) signals 'internal use' by convention.",
    "__name (double underscore) triggers name-mangling for stronger protection.",
    "@property lets you expose a controlled 'attribute-like' interface backed by real validation logic."
  ],
  code:`<span class="kw">class</span> <span class="cls">Mage</span>:
    <span class="kw">def</span> <span class="fn">__init__</span>(self, max_mana):
        self._max_mana = max_mana
        self._mana = max_mana

    <span class="kw">@property</span>
    <span class="kw">def</span> <span class="fn">mana</span>(self):
        <span class="kw">return</span> self._mana

    <span class="kw">@mana.setter</span>
    <span class="kw">def</span> <span class="fn">mana</span>(self, value):
        self._mana = <span class="fn">max</span>(0, <span class="fn">min</span>(value, self._max_mana))  <span class="com"># clamp safely</span>

merlin = <span class="cls">Mage</span>(max_mana=100)
merlin.mana = 150   <span class="com"># tries to overfill</span>
<span class="kw">print</span>(<span class="str">"Mana after overfill attempt:"</span>, merlin.mana)

merlin.mana -= 300  <span class="com"># tries to go negative</span>
<span class="kw">print</span>(<span class="str">"Mana after huge spell:"</span>, merlin.mana)`,
  out:`Mana after overfill attempt: 100
Mana after huge spell: 0`
},
{
  id:"dunder", cat:"Object-Oriented Programming", title:"Magic (Dunder) Methods", level:"advanced",

  lead:"Dunder ('double underscore') methods let your objects hook into Python's built-in syntax: print(), +, ==, len(), and more.",
  scenario:"Item Stacking — combine two potion stacks with + and print them nicely, just like built-in types.",
  key:[
    "__str__ controls what print(obj) shows.",

  ],
  code:`<span class="kw">class</span> <span class="cls">ItemStack</span>:
    <span class="kw">def</span> <span class="fn">__init__</span>(self, name, qty):
        self.name, self.qty = name, qty

    <span class="kw">def</span> <span class="fn">__str__</span>(self):
        <span class="kw">return</span> <span class="str">f"{self.qty}x {self.name}"</span>

    <span class="kw">def</span> <span class="fn">__add__</span>(self, other):

/* ============================ APP LOGIC ============================ */
const state = { current: TOPICS[0].id, completed: new Set(), filter:"" };

function levelChip(level){
  const map = {beginner:["Beginner","beginner"], intermediate:["Intermediate","intermediate"], advanced:["Advanced","advanced"]};
  const [label,cls] = map[level];
  return `<span class="chip ${cls}">${label}</span>`;
}
function lvlDot(level){
  return level==="beginner" ? "b" : level==="intermediate" ? "i" : "a";
}

function renderSidebar(){
  const nav = document.getElementById("navList");
  const q = state.filter.trim().toLowerCase();
  let html = "";
  CATS.forEach(cat=>{
    const items = TOPICS.filter(t=>t.cat===cat && (
      !q || t.title.toLowerCase().includes(q) || t.tags.join(" ").toLowerCase().includes(q)
    ));
    if(items.length===0) return;
    html += `<div class="cat">${cat}</div>`;
    items.forEach(t=>{
      const active = t.id===state.current ? "active" : "";
      const done = state.completed.has(t.id) ? "completed" : "";
      html += `<button class="topic-btn ${active} ${done}" data-id="${t.id}">
        <span class="lvl ${lvlDot(t.level)}"></span> ${t.title}
        <span class="done">✓</span>
      </button>`;
    });
  });
  nav.innerHTML = html || `<div class="empty-hint" style="padding:10px">No topics match your search.</div>`;
  nav.querySelectorAll(".topic-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{ state.current = btn.dataset.id; render(); window.scrollTo({top:0, behavior:"smooth"}); });
  });
}

function renderXP(){
  const total = TOPICS.length;
  const done = state.completed.size;
  document.getElementById("xpLabel").textContent = `${done} / ${total} completed`;
  document.getElementById("xpFill").style.width = `${(done/total*100).toFixed(0)}%`;
}

function neighbor(offset){
  const idx = TOPICS.findIndex(t=>t.id===state.current);
  const n = TOPICS[idx+offset];
  return n || null;
}

function render(){
  const t = TOPICS.find(x=>x.id===state.current);
  document.getElementById("crumbs").innerHTML = `<b>${t.cat}</b> / ${t.title}`;

  const prev = neighbor(-1), next = neighbor(1);
  const isDone = state.completed.has(t.id);

  document.getElementById("content").innerHTML = `
    <div class="head">
      <div>
        <h1>${t.title}</h1>
        ${levelChip(t.level)}
      </div>
      <label class="mark">
        <input type="checkbox" id="doneCheck" ${isDone?"checked":""}/>
        Mark as completed
      </label>
    </div>
    <div class="tags">${t.tags.map(tag=>`<span class="tag">#${tag}</span>`).join("")}</div>
    <p class="lead">${t.lead}</p>

    <div class="card">
      <h3><span class="ico">🎮</span> Real-world Example</h3>
      <div class="scenario">${t.scenario}</div>
    </div>

    <div class="card">
      <h3><span class="ico">💡</span> Key Ideas</h3>
      <ul class="keypoints">${t.key.map(k=>`<li>${k}</li>`).join("")}</ul>
    </div>

    <div class="grid2">
      <div class="card">
        <h3><span class="ico">🐍</span> Code</h3>
        <pre class="code">${t.code}</pre>
      </div>
      <div class="card">
        <h3><span class="ico">📤</span> Result</h3>
        <div class="out">${t.out}</div>
      </div>
    </div>

    <div class="footer-nav">
      <button class="navbtn" id="prevBtn" ${prev?"":"disabled"}>← ${prev?prev.title:"Start"}</button>
      <button class="navbtn primary" id="nextBtn" ${next?"":"disabled"}>${next?next.title:"Course complete 🎉"} →</button>
    </div>
  `;

  document.getElementById("doneCheck").addEventListener("change", (e)=>{
    if(e.target.checked) state.completed.add(t.id); else state.completed.delete(t.id);
    renderXP(); renderSidebar();
  });
  const pb = document.getElementById("prevBtn");
  const nb = document.getElementById("nextBtn");
  if(prev) pb.addEventListener("click", ()=>{ state.current = prev.id; render(); window.scrollTo({top:0, behavior:"smooth"}); });
  if(next) nb.addEventListener("click", ()=>{ state.current = next.id; render(); window.scrollTo({top:0, behavior:"smooth"}); });

  renderSidebar();
  renderXP();
}

document.getElementById("searchBox").addEventListener("input", (e)=>{
  state.filter = e.target.value;
  renderSidebar();
});

render();
</script>
</body>
