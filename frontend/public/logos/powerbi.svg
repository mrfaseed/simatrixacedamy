<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Power BI">
  <defs>
    <linearGradient id="pbiBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBE36B"/>
      <stop offset="0.45" stop-color="#F2C811"/>
      <stop offset="1" stop-color="#E0A312"/>
    </linearGradient>
  </defs>
  <!-- four ascending rounded bars, classic Power BI silhouette -->
  <rect x="23" y="3"  width="6" height="26" rx="2.4" fill="url(#pbiBar)"/>
  <rect x="15.5" y="9"  width="6" height="20" rx="2.4" fill="url(#pbiBar)"/>
  <rect x="8" y="15" width="6" height="14" rx="2.4" fill="url(#pbiBar)"/>
  <rect x="0.5" y="21" width="6" height="8"  rx="2.4" fill="url(#pbiBar)"/>
</svg>
